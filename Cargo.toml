[workspace]
resolver = "2"
members = [
    "crates/phy-core",
    "crates/phy-math",
    "crates/phy-rigid",
    "crates/phy-fluid",
    "crates/phy-optics",
    "crates/phy-field",
    "crates/phy-io",
    "crates/phy-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["physics-engine"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nalgebra = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
