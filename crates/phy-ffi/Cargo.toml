[package]
name = "phy-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "C ABI layer for the physics engine (cdylib for C/C++/Unity/Unreal linking)."

[lib]
# 同时产出 cdylib(供 C/C++ 业务 dlopen/链接) 与 rlib(供 Rust 侧单测)。
crate-type = ["cdylib", "rlib"]

[dependencies]
phy-core = { path = "../phy-core", version = "0.1.0" }
phy-math = { path = "../phy-math", version = "0.1.0" }
phy-rigid = { path = "../phy-rigid", version = "0.1.0" }
phy-fluid = { path = "../phy-fluid", version = "0.1.0" }
phy-granular = { path = "../phy-granular", version = "0.1.0" }
phy-field = { path = "../phy-field", version = "0.1.0" }
phy-soft = { path = "../phy-soft", version = "0.1.0" }
phy-solid = { path = "../phy-solid", version = "0.1.0" }
phy-optics = { path = "../phy-optics", version = "0.1.0" }
phy-io = { path = "../phy-io", version = "0.1.0" }

nalgebra.workspace = true
serde.workspace = true
num-traits.workspace = true

[build-dependencies]
# 仅在设置 PHY_FFI_GEN_HEADER=1 时由 build.rs 调用,生成 C 头文件;不拖慢常规构建。
cbindgen = "0.27"
