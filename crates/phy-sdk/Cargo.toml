[package]
name = "phy-sdk"
version = "0.1.0"
edition = "2021"
authors = ["physics-engine"]
license = "MIT OR Apache-2.0"
description = "集成 SDK:统一重导出 phy-* 子系统 + 开箱即用 PhysicsBuilder + 教程 doctest,屏蔽多 crate 拼装细节。"
repository = "https://github.com/physics-engine/physics"

[dependencies]
phy-core   = { path = "../phy-core", version = "0.1.0" }
phy-math   = { path = "../phy-math", version = "0.1.0" }
phy-rigid  = { path = "../phy-rigid", version = "0.1.0" }
phy-fluid  = { path = "../phy-fluid", version = "0.1.0" }
phy-granular = { path = "../phy-granular", version = "0.1.0" }
phy-soft   = { path = "../phy-soft", version = "0.1.0" }
phy-field  = { path = "../phy-field", version = "0.1.0" }
phy-optics = { path = "../phy-optics", version = "0.1.0" }
phy-solid  = { path = "../phy-solid", version = "0.1.0" }
phy-io     = { path = "../phy-io", version = "0.1.0" }

nalgebra = { workspace = true }
serde = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
