name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test workspace (default, fast unit tests)
        run: cargo test --workspace
      - name: Stability regression (M3 suite)
        run: cargo test -p phy-demo --test stability
      - name: Perf harness smoke (M2 baseline must compile + run)
        run: cargo run -p phy-demo --bin perf_sweep
      - name: Perf regression gate (G6)
        # 数值门禁:release 构建下测量,与受版本控制的基线 docs/perf_baseline.csv
        # 比对,任一场景单帧 ms 超 ±20% 即判回归并失败(G6 防"悄然变慢/变不准")。
        # 必须用 release(debug 计时抖动大,会误报);基线本身亦由 release 生成。
        run: cargo run --release -p phy-demo --bin perf_sweep -- --check
      - name: Test release + ignored (heavy numerical regression)
        run: cargo test --release -p phy-demo -- --ignored

  native:
    name: Native desktop (C-ABI) build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # M5 验证:原生 CPU 后端 + C ABI(phy-ffi cdylib)在所有桌面平台可编译,
      # 业务方可直接链入 C/C++/Unity/Unreal,无需 wgpu。
      - name: Build phy-ffi (cdylib) native
        run: cargo build -p phy-ffi

  wasm:
    name: WASM cross-compile guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cross-compile Web crates to wasm32
        run: python3 wasm-cross-check.py --all
